<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerta | Ingresar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar">
            <div class="container"><a class="navbar-brand marca" href="../index.html">HUERTA</a><a class="enlace"
                    href="../index.html">Volver al inicio</a></div>
        </nav>
    </header>
    <main class="pagina-interior">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="titulo-interior">
                        <p class="etiqueta">CUENTA</p>
                        <h1 class="h2">Ingresar</h1>
                        <p>COLOCAR TEXTO ACA</p>
                    </div>
                    <form class="panel">
                        <div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input
                                class="form-control" id="correo" type="email" placeholder="correo@ejemplo.com"></div>
                        <div class="mb-3"><label class="form-label" for="contrasena">Contraseña</label><input
                                class="form-control" id="contrasena" type="password" placeholder="COLOCAR TEXTO ACA">
                        </div><button class="boton boton-verde w-100" type="submit">Ingresar</button>
                        <p class="mt-4 mb-0 text-center">¿No tienes cuenta? <a class="enlace"
                                href="registro.html">Registrarse</a></p>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="pie-pagina">
        <div class="container">HUERTA</div>
    </footer>
</body>

</html>
