<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerta | Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar">
            <div class="container"><a class="navbar-brand marca" href="../index.html">HUERTA</a><a class="enlace"
                    href="login.html">Ya tengo una cuenta</a></div>
        </nav>
    </header>
    <main class="pagina-interior">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <p class="etiqueta">CUENTA</p>
                    <h1 class="h2 titulo-interior">Crear cuenta</h1>
                    <form class="panel row g-3">
                        <div class="col-md-6"><label class="form-label" for="nombre">Nombre</label><input
                                class="form-control" id="nombre" type="text"></div>
                        <div class="col-md-6"><label class="form-label" for="apellido">Apellido</label><input
                                class="form-control" id="apellido" type="text"></div>
                        <div class="col-12"><label class="form-label" for="correo">Correo electrónico</label><input
                                class="form-control" id="correo" type="email"></div>
                        <div class="col-md-6"><label class="form-label" for="contrasena">Contraseña</label><input
                                class="form-control" id="contrasena" type="password"></div>
                        <div class="col-md-6"><label class="form-label" for="telefono">Número de contacto</label><input
                                class="form-control" id="telefono" type="tel"></div>
                        <div class="col-12"><button class="boton boton-verde" type="submit">Crear cuenta</button></div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="pie-pagina">
        <div class="container">HUERTA</div>
    </footer>
</body>

</html>
