<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerta | Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar">
            <div class="container"><a class="navbar-brand marca" href="../index.html">HUERTA</a><a class="enlace"
                    href="login.html">Ya tengo una cuenta</a></div>
        </nav>
    </header>
    <main class="pagina-interior">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <p class="etiqueta">CUENTA</p>
                    <h1 class="h2 titulo-interior">Crear cuenta</h1>
                        <form class="panel row g-3" method="post" data-validacion data-registro novalidate>
                        <div class="col-12"><label class="form-label" for="run">RUN</label><input
                            class="form-control" id="run" name="run" type="text" autocomplete="off"
                            inputmode="text" minlength="7" maxlength="9" required data-regla="run"
                            data-mensaje="run-error" aria-describedby="run-error"><div
                            class="invalid-feedback" id="run-error"></div></div>
                        <div class="col-md-6"><label class="form-label" for="nombre">Nombre</label><input
                            class="form-control" id="nombre" name="nombre" type="text" autocomplete="given-name"
                            maxlength="50" required data-regla="nombre" data-maximo="50" data-mensaje="nombre-error"
                            aria-describedby="nombre-error"><div class="invalid-feedback" id="nombre-error"></div>
                        </div>
                        <div class="col-md-6"><label class="form-label" for="apellido">Apellido</label><input
                            class="form-control" id="apellido" name="apellido" type="text"
                            autocomplete="family-name" maxlength="100" required data-regla="nombre" data-maximo="100"
                            data-mensaje="apellido-error" aria-describedby="apellido-error"><div
                            class="invalid-feedback" id="apellido-error"></div></div>
                        <div class="col-12"><label class="form-label" for="correo">Correo electrónico</label><input
                            class="form-control" id="correo" name="correo" type="email" autocomplete="email"
                            maxlength="100" required data-regla="correo" data-mensaje="correo-error"
                            aria-describedby="correo-error"><div class="invalid-feedback" id="correo-error"></div>
                        </div>
                        <div class="col-md-6"><label class="form-label" for="fecha-nacimiento">Fecha de nacimiento</label><input
                            class="form-control" id="fecha-nacimiento" name="fechaNacimiento" type="text"
                            placeholder="dd/mm/aaaa" inputmode="numeric" autocomplete="bday" maxlength="10"
                            data-fecha-nacimiento data-regla="fecha" data-mensaje="fecha-nacimiento-error"
                            aria-describedby="fecha-nacimiento-error"><div class="invalid-feedback"
                            id="fecha-nacimiento-error"></div></div>
                        <div class="col-md-6"><label class="form-label" for="region">Región</label><select
                            class="form-select" id="region" name="region" data-region-select="registro" required data-regla="seleccion"
                            data-mensaje="region-error" aria-describedby="region-error"><option value="">Selecciona una región</option></select><div
                            class="invalid-feedback" id="region-error"></div></div>
                        <div class="col-md-6"><label class="form-label" for="comuna">Comuna</label><select
                            class="form-select" id="comuna" name="comuna" data-comuna-select="registro" required disabled data-regla="seleccion"
                            data-mensaje="comuna-error" aria-describedby="comuna-error"><option value="">Selecciona una comuna</option></select><div
                            class="invalid-feedback" id="comuna-error"></div></div>
                        <div class="col-12"><label class="form-label" for="direccion">Dirección</label><textarea
                            class="form-control" id="direccion" name="direccion" rows="2" maxlength="300" required
                            data-regla="direccion" data-mensaje="direccion-error"
                            aria-describedby="direccion-error"></textarea><div class="invalid-feedback" id="direccion-error"></div></div>
                        <div class="col-md-6"><label class="form-label" for="contrasena">Contraseña</label><input
                            class="form-control" id="contrasena" name="contrasena" type="password"
                            autocomplete="new-password" maxlength="10" required data-regla="contrasena"
                            data-mensaje="contrasena-error" aria-describedby="contrasena-error"><div
                            class="invalid-feedback" id="contrasena-error"></div>
                            <div class="mt-2" id="requisitos-contrasena">
                                <div class="progress" id="progreso-contrasena" role="progressbar"
                                    aria-label="Requisitos de contraseña cumplidos" aria-valuemin="0" aria-valuemax="6"
                                    aria-valuenow="0" aria-valuetext="0 de 6 requisitos cumplidos">
                                    <div class="progress-bar" id="barra-progreso-contrasena" style="width: 0%"></div>
                                </div>
                                <p class="small mt-2 mb-1" id="resumen-progreso-contrasena" aria-live="polite">0 de 6 requisitos cumplidos.</p>
                                <ul class="small list-unstyled mb-0">
                                    <li class="text-body-secondary" data-requisito-contrasena="longitud"><span data-estado-requisito>Pendiente</span>: Al menos 4 caracteres</li>
                                    <li class="text-body-secondary" data-requisito-contrasena="mayuscula"><span data-estado-requisito>Pendiente</span>: Una letra mayúscula</li>
                                    <li class="text-body-secondary" data-requisito-contrasena="minuscula"><span data-estado-requisito>Pendiente</span>: Una letra minúscula</li>
                                    <li class="text-body-secondary" data-requisito-contrasena="numero"><span data-estado-requisito>Pendiente</span>: Un número</li>
                                    <li class="text-body-secondary" data-requisito-contrasena="simbolo"><span data-estado-requisito>Pendiente</span>: Un símbolo</li>
                                    <li class="text-body-secondary" data-requisito-contrasena="maximo"><span data-estado-requisito>Pendiente</span>: Máximo 10 caracteres</li>
                                </ul>
                            </div>
                        </div>
                        <div class="col-md-6"><label class="form-label" for="telefono">Número de contacto</label><input
                            class="form-control" id="telefono" name="telefono" type="tel" inputmode="numeric"
                            autocomplete="tel" required data-regla="telefono"
                            data-mensaje="telefono-error" aria-describedby="telefono-error"><div
                            class="invalid-feedback" id="telefono-error"></div></div>
                        <div class="col-12" id="mensaje-registro" role="status" aria-live="polite"></div>
                        <div class="col-12"><button class="boton boton-verde" type="submit">Crear cuenta</button></div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="pie-pagina">
        <div class="container">HUERTA</div>
    </footer>
    <script src="../js/ubicaciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/es.js"></script>
    <script src="../js/fechas.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/usuarios.js"></script>
    <script src="../js/registro.js"></script>
    <script src="../js/menu.js"></script>
</body>

</html>
