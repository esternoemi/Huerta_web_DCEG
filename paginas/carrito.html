<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerta | Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar">
            <div class="container"><a class="navbar-brand marca" href="../index.html">HUERTA</a><a class="enlace"
                    href="productos.html">Seguir comprando</a></div>
        </nav>
    </header>
    <main class="pagina-interior">
        <div class="container">
            <p class="etiqueta">COMPRA</p>
            <h1 class="h2 titulo-interior">Carrito</h1>
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="tabla-vacia">COLOCAR PRODUCTOS DEL CARRITO ACA</div>
                </div>
                <div class="col-lg-4">
                    <div class="panel">
                        <h2 class="h4">Resumen</h2>
                        <div class="d-flex justify-content-between mt-4"><span>Subtotal</span><strong>$ 0.000</strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between"><span>Total</span><strong class="precio">$
                                0.000</strong></div><button class="boton boton-verde w-100 mt-4" type="button">Continuar
                            compra</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="pie-pagina">
        <div class="container">HUERTA</div>
    </footer>
</body>

</html>
