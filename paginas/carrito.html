<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerta | Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar">
                <div class="container"><a class="navbar-brand marca" href="../index.html">HUERTA</a><div class="d-flex gap-3 align-items-center"><a class="boton boton-claro" href="productos.html" data-contador-carrito>Carrito (0)</a><a class="enlace"
                    href="productos.html">Seguir comprando</a></div></div>
        </nav>
    </header>
    <main class="pagina-interior">
        <div class="container">
            <p class="etiqueta">COMPRA</p>
            <h1 class="h2 titulo-interior">Carrito</h1>
            <div class="row g-4">
                <div class="col-lg-8">
                    <p id="mensaje-carrito" role="status" aria-live="polite"></p>
                    <div id="carrito-vacio" class="tabla-vacia">Tu carrito está vacío.</div>
                    <div id="items-carrito"></div>
                    <button class="btn btn-outline-danger" id="vaciar-carrito" type="button">Vaciar carrito</button>
                </div>
                <div class="col-lg-4">
                    <div class="panel" id="resumen-carrito" hidden>
                        <h2 class="h4">Resumen</h2>
                        <div class="d-flex justify-content-between mt-4"><span>Subtotal</span><strong id="subtotal-carrito"></strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between"><span>Total</span><strong class="precio" id="total-carrito"></strong></div>
                        <button class="boton boton-verde w-100 mt-4" id="continuar-compra" type="button">Confirmar pedido de demostración</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="pie-pagina">
        <div class="container">HUERTA</div>
    </footer>
    <script src="../js/productos.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/carrito.js"></script>
</body>

</html>
