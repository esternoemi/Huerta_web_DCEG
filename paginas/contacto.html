<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Hogar 🌿 | Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand marca" href="../index.html">Huerto Hogar 🌿</a>
                <button class="navbar-toggler" type="button" id="boton-menu" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-collapse d-none d-lg-block" id="menu-principal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link activo" href="productos.html">Productos</a></li>
                        <li class="nav-item"> <a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="boton boton-claro" href="login.html">Ingresar</a></li>
                        <li class="nav-item"><a class="boton boton-verde" href="carrito.html">Carrito (0)</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <main class="pagina-interior">
        <div class="container">
            <div class="row g-5">
                <div class="col-lg-5">
                    <p class="etiqueta">HABLEMOS</p>
                    <h1 class="h2">Contacto</h1>
                    <p>COLOCAR INFORMACIÓN DE CONTACTO ACA</p>
                    <div class="mt-4">
                        <p><strong>Correo</strong><br>correo@ejemplo.com</p>
                        <p><strong>Horario</strong><br>COLOCAR HORARIO ACA</p>
                    </div>
                </div>
                <div class="col-lg-7">
                        <form class="panel" method="post" data-validacion novalidate>
                        <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input
                            class="form-control" id="nombre" name="nombre" type="text" autocomplete="name"
                            maxlength="100" required data-regla="nombre" data-mensaje="nombre-error"
                            aria-describedby="nombre-error"><div class="invalid-feedback" id="nombre-error"></div>
                        </div>
                        <div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input
                            class="form-control" id="correo" name="correo" type="email" autocomplete="email"
                            maxlength="100" required data-regla="correo" data-mensaje="correo-error"
                            aria-describedby="correo-error"><div class="invalid-feedback" id="correo-error"></div>
                        </div>
                        <div class="mb-3"><label class="form-label" for="mensaje">Mensaje</label><textarea
                            class="form-control" id="mensaje" name="mensaje" rows="5" maxlength="200" required
                            data-regla="mensaje" data-mensaje="mensaje-error" data-contador="mensaje-contador"
                            aria-describedby="mensaje-error mensaje-contador"></textarea><div
                            class="invalid-feedback" id="mensaje-error"></div><div class="form-text"
                            id="mensaje-contador">0/200 caracteres</div></div><button
                            class="boton boton-verde" type="submit">Enviar mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </main>


    <footer class="pie-pagina">
        <div class="container d-flex justify-content-between flex-wrap gap-3"><span>HUERTO HOGAR 🌿</span><span>TODOS
                LOS DERECHOS RESERVADOS</span></div>
    </footer>


    <script src="../js/validaciones.js"></script>
    <script src="../js/menu.js"></script>
</body>

</html>
