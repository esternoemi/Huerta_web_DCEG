<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerta | Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar">
            <div class="container"><a class="navbar-brand marca" href="../index.html">HUERTA</a><a class="enlace"
                    href="../index.html">Inicio</a></div>
        </nav>
    </header>
    <main class="pagina-interior">
        <div class="container">
            <div class="row g-5">
                <div class="col-lg-5">
                    <p class="etiqueta">HABLEMOS</p>
                    <h1 class="h2">Contacto</h1>
                    <p>COLOCAR INFORMACIÓN DE CONTACTO ACA</p>
                    <div class="mt-4">
                        <p><strong>Correo</strong><br>correo@ejemplo.com</p>
                        <p><strong>Horario</strong><br>COLOCAR HORARIO ACA</p>
                    </div>
                </div>
                <div class="col-lg-7">
                    <form class="panel">
                        <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input
                                class="form-control" id="nombre" type="text"></div>
                        <div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input
                                class="form-control" id="correo" type="email"></div>
                        <div class="mb-3"><label class="form-label" for="mensaje">Mensaje</label><textarea
                                class="form-control" id="mensaje" rows="5"></textarea></div><button
                            class="boton boton-verde" type="submit">Enviar mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="pie-pagina">
        <div class="container">HUERTA</div>
    </footer>
</body>

</html>
