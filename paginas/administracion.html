<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Hogar | Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>

<body>
    <header class="encabezado">
        <nav class="navbar">
            <div class="container">
                <a class="navbar-brand marca" href="../index.html">HUERTA</a>
                <button class="btn btn-outline-secondary btn-sm" id="cerrar-sesion" type="button">Cerrar sesión</button>
            </div>
        </nav>
    </header>
    <main class="pagina-interior">
        <div class="container">
            <p class="etiqueta">ADMINISTRACIÓN</p>
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                <div>
                    <h1 class="h2 titulo-interior">Gestión de usuarios</h1>
                    <p>Sesión de administrador: <strong id="administrador-actual"></strong></p>
                </div>
            </div>
            <div id="mensaje-administracion" role="status" aria-live="polite"></div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Correo</th>
                            <th scope="col">Rol</th>
                            <th scope="col">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="usuarios-administrados"></tbody>
                </table>
            </div>
        </div>
    </main>
    <footer class="pie-pagina">
        <div class="container">HUERTA</div>
    </footer>
    <script src="../js/usuarios.js"></script>
    <script src="../js/administracion.js"></script>
</body>

</html>
